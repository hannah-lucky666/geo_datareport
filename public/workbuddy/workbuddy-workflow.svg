<svg xmlns="http://www.w3.org/2000/svg" width="780" height="525" viewBox="0 0 780 525" role="img" aria-labelledby="title desc">
  <title id="title">WorkBuddy 工作方式示意</title>
  <desc id="desc">任务目标和工作资料进入 WorkBuddy 任务编排中枢，再调用模型、技能与文件工具，交付可编辑的办公文件。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#8EA4BD"/>
    </marker>
    <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7.6" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#2E67AD"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 700; fill: #2E67AD; letter-spacing: 1.4px; }
      .title { font-size: 24px; font-weight: 700; fill: #17345C; }
      .title-strong { font-size: 27px; font-weight: 700; fill: #215DA8; }
      .body { font-size: 17px; fill: #60758E; }
      .badge { font-size: 13px; font-weight: 700; fill: #365A86; }
      .flow { fill: none; stroke: #8EA4BD; stroke-width: 2.2; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2E67AD; stroke-width: 2.5; marker-end: url(#arrowBlue); }
      .bus { fill: none; stroke: #8EA4BD; stroke-width: 2.2; }
    </style>
  </defs>

  <rect x="4" y="4" width="772" height="517" rx="24" fill="#FCFDFE" stroke="#DCE5EF" stroke-width="1.5"/>
  <rect x="22" y="18" width="195" height="30" rx="15" fill="#EEF4FB"/>
  <text x="40" y="39" class="eyebrow">任务输入 → 智能执行</text>

  <!-- Connectors sit behind the cards. -->
  <path d="M192 128 V149 H312 V171" class="flow"/>
  <path d="M588 128 V149 H468 V171" class="flow"/>
  <path d="M390 261 V289" class="bus"/>
  <path d="M130 289 H650" class="bus"/>
  <path d="M130 289 V320" class="flow"/>
  <path d="M390 289 V320" class="flow"/>
  <path d="M650 289 V320" class="flow"/>
  <circle cx="390" cy="289" r="4.2" fill="#8EA4BD"/>
  <path d="M130 400 V425 H390" class="bus"/>
  <path d="M650 400 V425 H390" class="bus"/>
  <path d="M390 400 V445" class="flow-blue"/>
  <circle cx="390" cy="425" r="4.2" fill="#2E67AD"/>

  <!-- User-provided inputs. -->
  <rect x="24" y="57" width="336" height="71" rx="17" fill="#FFFFFF" stroke="#BFCFE0" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="46" y="88" class="title">自然语言任务</text>
  <text x="46" y="113" class="body">例如：整理资料并生成汇报</text>
  <rect x="288" y="67" width="55" height="23" rx="11.5" fill="#F0F5FA"/>
  <text x="301" y="84" class="badge">人工</text>

  <rect x="420" y="57" width="336" height="71" rx="17" fill="#F5F8FC" stroke="#C9D8E8" stroke-width="1.6"/>
  <text x="442" y="88" class="title">工作资料与权限</text>
  <text x="442" y="113" class="body">文件、资料库及获准使用的工具</text>

  <!-- WorkBuddy is the agent orchestration layer. -->
  <rect x="122" y="171" width="536" height="90" rx="20" fill="#EAF2FD" stroke="#8EB5E6" stroke-width="2"/>
  <text x="390" y="207" text-anchor="middle" class="title-strong">WorkBuddy · 任务编排中枢</text>
  <text x="390" y="237" text-anchor="middle" class="body">理解目标 · 拆分步骤 · 协调模型与工具</text>

  <!-- Three capabilities can be called according to the task. -->
  <rect x="24" y="320" width="212" height="80" rx="17" fill="#FFFFFF" stroke="#C5D5E6" stroke-width="1.6"/>
  <text x="130" y="353" text-anchor="middle" class="title">模型推理</text>
  <text x="130" y="382" text-anchor="middle" class="body">分析 · 生成内容</text>

  <rect x="284" y="320" width="212" height="80" rx="17" fill="#F5F8FC" stroke="#C5D5E6" stroke-width="1.6"/>
  <text x="390" y="353" text-anchor="middle" class="title">技能与连接器</text>
  <text x="390" y="382" text-anchor="middle" class="body">Skills · MCP</text>

  <rect x="544" y="320" width="212" height="80" rx="17" fill="#FFFFFF" stroke="#C5D5E6" stroke-width="1.6"/>
  <text x="650" y="353" text-anchor="middle" class="title">文件与应用</text>
  <text x="650" y="382" text-anchor="middle" class="body">读取 · 编辑 · 保存</text>

  <!-- Deliverable. -->
  <rect x="160" y="445" width="460" height="62" rx="19" fill="#EAF2FD" stroke="#79A8DF" stroke-width="2"/>
  <text x="390" y="474" text-anchor="middle" class="title-strong">交付可编辑成果</text>
  <text x="390" y="496" text-anchor="middle" class="body">文档 / 表格 / 演示稿等</text>
</svg>
